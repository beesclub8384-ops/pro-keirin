<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>오프라인 · 7RANDOMS 인터뷰</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #1a1a1a url("/images/interview-bg.png") center / cover no-repeat fixed;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 0;
      }
      .card {
        position: relative; z-index: 1;
        width: 100%; max-width: 360px;
        background: rgba(255, 255, 255, 0.96);
        color: #1a1a1a;
        border-radius: 16px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }
      .logo { height: 44px; width: auto; margin: 0 auto 20px; display: block; }
      .icon {
        width: 56px; height: 56px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 9999px; background: #f1f1f1; font-size: 28px;
      }
      h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
      p { font-size: 14px; line-height: 1.6; color: #555; margin-bottom: 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        width: 100%; padding: 12px 16px;
        border-radius: 10px; font-size: 15px; font-weight: 600;
        color: #fff; background: #e11d2a;
        transition: background 0.15s ease;
      }
      button:hover { background: #c4161f; }
    </style>
  </head>
  <body>
    <div class="overlay"></div>
    <div class="card">
      <!-- 로고는 SW 이미지 캐시에서 로드, 실패 시 숨김 -->
      <img class="logo" src="/images/logo.png" alt="7randoms" onerror="this.style.display='none'" />
      <div class="icon">📡</div>
      <h1>인터넷 연결을 확인해주세요</h1>
      <p>오프라인 상태입니다.<br />연결이 복구되면 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
